{% extends "base.html" %}
{% block title %}Admin Login - {{ site_name }}{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <div style="width:70px;height:70px;border-radius:50%;background:var(--gradient-gold);display:inline-flex;align-items:center;justify-content:center;color:var(--text-dark);font-size:1.8rem;margin-bottom:1rem;">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h2>Coach Dashboard</h2>
            <p class="text-muted">Admin access only</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn-book">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
