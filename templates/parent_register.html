{% extends "base.html" %}
{% block title %}Create Account - {{ site_name }}{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card" style="max-width:500px;">
        <div class="text-center mb-4">
            <div style="width:70px;height:70px;border-radius:50%;background:var(--gradient-primary);display:inline-flex;align-items:center;justify-content:center;color:white;font-size:1.8rem;margin-bottom:1rem;">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2>Create Your Account</h2>
            <p class="text-muted">Sign up to manage bookings, payments, and communicate with the coach.</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-control" required placeholder="Your full name">
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" class="form-control" required placeholder="you@email.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="(555) 123-4567">
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control" required placeholder="Min 6 characters" minlength="6">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" name="confirm_password" class="form-control" required placeholder="Confirm password" minlength="6">
                </div>
            </div>
            <button type="submit" class="btn-book">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <small class="text-muted">
                Already have an account?
                <a href="{{ url_for('parent_login') }}" style="color:var(--primary);font-weight:600;">Log in here</a>
            </small>
        </div>
    </div>
</div>
{% endblock %}
